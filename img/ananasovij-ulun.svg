<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f1ead6"/>
    </radialGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f3ec"/>
      <stop offset="1" stop-color="#d8d1c2"/>
    </linearGradient>
    <linearGradient id="pine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd54a"/>
      <stop offset="1" stop-color="#f3a619"/>
    </linearGradient>
    <g id="leaf">
      <path d="M0 -14 C10 -10 12 6 0 14 C-12 6 -10 -10 0 -14Z" fill="#4f7a3a"/>
      <path d="M0 -12 C3 -4 3 4 0 12" stroke="#3b5d2b" stroke-width="1.5" fill="none"/>
    </g>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- pineapple slice -->
  <g transform="translate(430 170) rotate(-18)">
    <path d="M-95 60 A110 110 0 0 1 95 60 Z" fill="#c98b1b"/>
    <path d="M-82 56 A96 96 0 0 1 82 56 Z" fill="url(#pine)"/>
    <path d="M-26 56 A28 28 0 0 1 26 56 Z" fill="#ffeaa0"/>
    <g stroke="#e59a16" stroke-width="3" opacity=".6">
      <line x1="0" y1="28" x2="0" y2="-36"/>
      <line x1="-20" y1="34" x2="-56" y2="-12"/>
      <line x1="20" y1="34" x2="56" y2="-12"/>
      <line x1="-26" y1="46" x2="-76" y2="28"/>
      <line x1="26" y1="46" x2="76" y2="28"/>
    </g>
  </g>

  <!-- shadow -->
  <ellipse cx="290" cy="470" rx="190" ry="26" fill="#000" opacity=".08"/>

  <!-- bowl -->
  <path d="M110 330 Q120 470 290 470 Q460 470 470 330 Z" fill="url(#bowl)"/>
  <ellipse cx="290" cy="330" rx="180" ry="42" fill="#e9e3d6"/>

  <!-- tea pile -->
  <ellipse cx="290" cy="326" rx="160" ry="34" fill="#3f6430"/>
  <g>
    <use href="#leaf" transform="translate(190 318) rotate(30)"/>
    <use href="#leaf" transform="translate(220 300) rotate(-40)"/>
    <use href="#leaf" transform="translate(250 290) rotate(80)"/>
    <use href="#leaf" transform="translate(285 284) rotate(10)"/>
    <use href="#leaf" transform="translate(320 290) rotate(-70)"/>
    <use href="#leaf" transform="translate(355 300) rotate(45)"/>
    <use href="#leaf" transform="translate(385 316) rotate(-20)"/>
    <use href="#leaf" transform="translate(240 322) rotate(120)"/>
    <use href="#leaf" transform="translate(300 316) rotate(-110)"/>
    <use href="#leaf" transform="translate(345 326) rotate(160)"/>
    <use href="#leaf" transform="translate(270 306) rotate(200)"/>
  </g>
  <!-- pineapple pieces in tea -->
  <rect x="226" y="296" width="18" height="16" rx="3" fill="#f7c03a" transform="rotate(-15 235 304)"/>
  <rect x="330" y="304" width="16" height="15" rx="3" fill="#f7c03a" transform="rotate(20 338 311)"/>
  <rect x="292" y="296" width="14" height="13" rx="3" fill="#ffd54a"/>

  <!-- loose leaves around -->
  <use href="#leaf" transform="translate(120 500) rotate(60)"/>
  <use href="#leaf" transform="translate(470 510) rotate(-30)"/>
  <use href="#leaf" transform="translate(500 470) rotate(100)"/>
</svg>
